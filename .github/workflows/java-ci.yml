name: Java CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "java/chart-renderer/**"
      - ".github/workflows/java-*.yml"
  push:
    branches:
      - main
    paths:
      - "java/chart-renderer/**"
      - ".github/workflows/java-*.yml"

concurrency:
  group: java-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and build JAR
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: java/chart-renderer/pom.xml

      - name: Run unit tests
        working-directory: java/chart-renderer
        run: mvn --batch-mode clean verify

      - name: Run production JAR smoke tests
        run: bash java/chart-renderer/test.sh

      - name: Upload production JAR
        uses: actions/upload-artifact@v7
        with:
          name: chart-renderer-${{ github.sha }}
          path: java/chart-renderer/build/libs/chart-renderer.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chart-renderer-test-reports-${{ github.run_id }}
          path: java/chart-renderer/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7
